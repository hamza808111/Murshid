name: Tests

on:
  push:
    branches: [ main, mainn, develop ]
  pull_request:
    branches: [ main, mainn, develop ]

jobs:
  unit-tests:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Murshid-Frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./Murshid-Frontend
        run: npm ci
      
      - name: Run unit tests
        working-directory: ./Murshid-Frontend
        run: npm run test:run
      
      - name: Generate coverage report
        working-directory: ./Murshid-Frontend
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./Murshid-Frontend/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Murshid-Frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./Murshid-Frontend
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: ./Murshid-Frontend
        run: npx playwright install --with-deps
      
      - name: Run E2E tests
        working-directory: ./Murshid-Frontend
        run: npm run test:e2e
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: Murshid-Frontend/playwright-report/
          retention-days: 30

